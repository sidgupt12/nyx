; Open this folder with PlatformIO in VS Code.
[env:esp32-s3-devkitc-1]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@2.36.12
    bblanchon/ArduinoJson@6.21.5

; Use the board's USB/UART connector for both upload and the Nyx bridge.
; No USB CDC flags: Arduino Serial remains on UART0 through the WCH chip.
